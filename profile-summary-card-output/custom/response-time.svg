<svg xmlns="http://www.w3.org/2000/svg" width="210" height="250" viewBox="0 0 210 250">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#101722"/>
    </linearGradient>

    <linearGradient id="greenBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#18d7a0"/>
      <stop offset="100%" stop-color="#28e07c"/>
    </linearGradient>

    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="209" height="249" rx="8" fill="url(#cardBg)" stroke="#30363d"/>
  <rect x="8" y="8" width="194" height="234" rx="8" fill="none" stroke="#26384c"/>

  <text x="16" y="30" fill="#ffffff" font-size="18" font-weight="600" font-family="Segoe UI, Arial, sans-serif">Response time</text>
  <text x="16" y="50" fill="#c9d1d9" font-size="10.5" font-family="Segoe UI, Arial, sans-serif">Average delay to reply to issues.</text>

  <circle cx="36" cy="95" r="20" fill="#173226" filter="url(#softGlow)"/>
  <path d="M38 77 L28 97 H37 L33 115 L47 92 H38 Z" fill="#1de06f"/>

  <text x="60" y="99" fill="#ffffff" font-size="18" font-weight="700" font-family="Segoe UI, Arial, sans-serif">0.4 days</text>

  <rect x="16" y="116" width="128" height="9" rx="4.5" fill="#173226"/>
  <rect x="16" y="116" width="115.2" height="9" rx="4.5" fill="url(#greenBar)"/>

  <text x="16" y="145" fill="#ffffff" font-size="11" font-family="Segoe UI, Arial, sans-serif">&lt; 1 day</text>
  <text x="194" y="145" text-anchor="end" fill="#ffffff" font-size="11" font-family="Segoe UI, Arial, sans-serif">90%</text>

  <text x="16" y="166" fill="#ffffff" font-size="11" font-family="Segoe UI, Arial, sans-serif">1-3 days</text>
  <text x="194" y="166" text-anchor="end" fill="#ffffff" font-size="11" font-family="Segoe UI, Arial, sans-serif">8%</text>

  <text x="16" y="187" fill="#ffffff" font-size="11" font-family="Segoe UI, Arial, sans-serif">&gt; 3 days</text>
  <text x="194" y="187" text-anchor="end" fill="#ffffff" font-size="11" font-family="Segoe UI, Arial, sans-serif">2%</text>

</svg>
