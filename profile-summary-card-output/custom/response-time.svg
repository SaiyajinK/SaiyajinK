<svg xmlns="http://www.w3.org/2000/svg" width="210" height="250" viewBox="0 0 210 250">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#101722"/>
    </linearGradient>

    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="209" height="249" rx="8" fill="#0d1117" stroke="#30363d"/>

  <g transform="translate(0, 16)">
    <text x="105.0" y="28" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="600" font-family="Segoe UI, Arial, sans-serif">Response time</text>
    <text x="105.0" y="48" text-anchor="middle" fill="#c9d1d9" font-size="10.5" font-family="Segoe UI, Arial, sans-serif">Average delay to reply to issues.</text>

    <g transform="translate(0, 84)">
      <circle cx="56" cy="0" r="20" fill="#173226" filter="url(#softGlow)"/>
      <path d="M58 -18 L48 2 H57 L53 20 L67 -3 H58 Z" fill="#1de06f"/>
      <text x="112" y="5" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700" font-family="Segoe UI, Arial, sans-serif">0.4 days</text>
    </g>

    <rect x="39" y="110" width="132" height="9" rx="4.5" fill="#173226"/>
    <rect x="39" y="110" width="115.2" height="9" rx="4.5" fill="url(#greenBar)"/>

    <text x="39" y="140" fill="#ffffff" font-size="11" font-family="Segoe UI, Arial, sans-serif">&lt; 1 day</text>
    <text x="171" y="140" text-anchor="end" fill="#ffffff" font-size="11" font-family="Segoe UI, Arial, sans-serif">90%</text>

    <text x="39" y="161" fill="#ffffff" font-size="11" font-family="Segoe UI, Arial, sans-serif">1-3 days</text>
    <text x="171" y="161" text-anchor="end" fill="#ffffff" font-size="11" font-family="Segoe UI, Arial, sans-serif">8%</text>

    <text x="39" y="182" fill="#ffffff" font-size="11" font-family="Segoe UI, Arial, sans-serif">&gt; 3 days</text>
    <text x="171" y="182" text-anchor="end" fill="#ffffff" font-size="11" font-family="Segoe UI, Arial, sans-serif">2%</text>
  </g>
</svg>
