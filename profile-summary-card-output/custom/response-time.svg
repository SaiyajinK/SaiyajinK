<svg xmlns="http://www.w3.org/2000/svg" width="230" height="250" viewBox="0 0 230 250">
  <defs>
    <linearGradient id="bgGlow" x1="0" y1="0" x2="230" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0f1721"/>
    </linearGradient>

    <linearGradient id="greenBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#18d7a0"/>
      <stop offset="100%" stop-color="#28e07c"/>
    </linearGradient>

    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="229" height="249" rx="8" fill="url(#bgGlow)" stroke="#30363d"/>
  <rect x="8" y="8" width="214" height="234" rx="8" fill="none" stroke="#26384c"/>

  <rect x="16" y="14" width="30" height="24" rx="6" fill="#14304d" stroke="#20496f"/>
  <text x="31" y="30" text-anchor="middle" fill="#cfe6ff" font-size="14" font-weight="700" font-family="Segoe UI, Arial, sans-serif">03</text>

  <text x="55" y="30" fill="#ffffff" font-size="21" font-weight="600" font-family="Segoe UI, Arial, sans-serif">Temps de réponse</text>
  <text x="18" y="52" fill="#c9d1d9" font-size="12" font-family="Segoe UI, Arial, sans-serif">Délai moyen pour répondre aux issues.</text>

  <circle cx="38" cy="95" r="21" fill="#173226" filter="url(#softGlow)"/>
  <path d="M40 76 L30 96 H39 L35 114 L49 91 H40 Z" fill="#1de06f"/>

  <text x="66" y="98" fill="#ffffff" font-size="20" font-weight="700" font-family="Segoe UI, Arial, sans-serif">0,4 jours</text>

  <rect x="18" y="116" width="150" height="9" rx="4.5" fill="#173226"/>
  <rect x="18" y="116" width="135.0" height="9" rx="4.5" fill="url(#greenBar)"/>

  <text x="18" y="145" fill="#ffffff" font-size="12" font-family="Segoe UI, Arial, sans-serif">&lt; 1 jour</text>
  <text x="196" y="145" text-anchor="end" fill="#ffffff" font-size="12" font-family="Segoe UI, Arial, sans-serif">90%</text>

  <text x="18" y="166" fill="#ffffff" font-size="12" font-family="Segoe UI, Arial, sans-serif">1-3 jours</text>
  <text x="196" y="166" text-anchor="end" fill="#ffffff" font-size="12" font-family="Segoe UI, Arial, sans-serif">8%</text>

  <text x="18" y="187" fill="#ffffff" font-size="12" font-family="Segoe UI, Arial, sans-serif">&gt; 3 jours</text>
  <text x="196" y="187" text-anchor="end" fill="#ffffff" font-size="12" font-family="Segoe UI, Arial, sans-serif">2%</text>

  <text x="18" y="221" fill="#c9d1d9" font-size="12" font-family="Segoe UI, Arial, sans-serif">Montre la réactivité sur les discussions.</text>
</svg>
